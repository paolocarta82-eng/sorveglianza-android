name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Trova il progetto Gradle
        id: trova
        run: |
          D=$(dirname "$(find . -name settings.gradle.kts -not -path '*/build/*' | head -1)")
          echo "Progetto trovato in: $D"
          test -n "$D" || { echo "settings.gradle.kts non presente nel repo"; exit 1; }
          echo "dir=$D" >> "$GITHUB_OUTPUT"

      - name: Compila l'APK
        working-directory: ${{ steps.trova.outputs.dir }}
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CoperturaRete-apk
          path: ${{ steps.trova.outputs.dir }}/app/build/outputs/apk/release/*.apk
