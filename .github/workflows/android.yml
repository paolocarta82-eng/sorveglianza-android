      - name: Compila l'APK
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CoperturaRete-apk
          path: android/app/build/outputs/apk/release/*.apk

