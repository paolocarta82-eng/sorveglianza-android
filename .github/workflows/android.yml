name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # Il gradle preinstallato sul runner e' la 9.x, incompatibile con AGP 8.5.
      # Genero il wrapper 8.7 in una cartella vuota e lo copio nel progetto,
      # cosi' il progetto non viene mai configurato con la 9.x.
      - name: Genera il wrapper Gradle 8.7
        run: |
          mkdir -p /tmp/wrap && cd /tmp/wrap
          touch settings.gradle.kts
          gradle wrapper --gradle-version 8.7 --no-daemon
          cp -r /tmp/wrap/gradle /tmp/wrap/gradlew "$GITHUB_WORKSPACE"/
          chmod +x "$GITHUB_WORKSPACE"/gradlew

      - name: Compila l'APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: CoperturaRete-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
